<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">AgenticSeg-RL Act-Inspect-Correct loop</title>
  <desc id="desc">An image and instruction enter the Act policy, SAM renders a mask, Inspect accepts it or sends it to Correct, and correction prompts return to SAM.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#29465B" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7890A2"/>
    </marker>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FCFD"/>
      <stop offset="1" stop-color="#F5F8FC"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="498" rx="28" fill="url(#canvas)" stroke="#E4EDF1"/>
  <text x="42" y="48" fill="#7890A2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">INFERENCE LOOP</text>
  <text x="42" y="78" fill="#18364A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">From a first mask to a verified mask</text>

  <!-- connectors -->
  <g fill="none" stroke="#7890A2" stroke-width="2" marker-end="url(#arrow)">
    <path d="M188 218 H234"/>
    <path d="M454 218 H500"/>
    <path d="M650 218 H696"/>
    <path d="M930 172 C968 172 974 127 1003 127"/>
    <path d="M814 308 C814 326 836 338 858 351"/>
    <path d="M758 408 C625 478 575 392 575 270" stroke-dasharray="7 7"/>
  </g>

  <!-- input -->
  <g filter="url(#shadow)">
    <rect x="40" y="183" width="148" height="70" rx="35" fill="#FFFFFF" stroke="#C9D7DF" stroke-width="1.5"/>
  </g>
  <circle cx="70" cy="218" r="12" fill="#E8F3F7"/>
  <path d="M64 218h12M70 212v12" stroke="#50849B" stroke-width="1.8" stroke-linecap="round"/>
  <text x="92" y="213" fill="#24475B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">Image</text>
  <text x="92" y="234" fill="#637E8E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">+ instruction</text>

  <!-- act -->
  <g filter="url(#shadow)">
    <rect x="234" y="128" width="220" height="180" rx="22" fill="#EAF4FF" stroke="#8DBCE7" stroke-width="1.5"/>
  </g>
  <rect x="254" y="148" width="46" height="27" rx="13.5" fill="#FFFFFF" fill-opacity="0.78"/>
  <text x="277" y="167" text-anchor="middle" fill="#3979B5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750">01</text>
  <text x="254" y="208" fill="#173F62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750">ACT</text>
  <text x="254" y="237" fill="#345B77" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Localize the target</text>
  <line x1="254" y1="255" x2="434" y2="255" stroke="#C9E0F4"/>
  <text x="254" y="281" fill="#59778B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5">box + prompt point</text>

  <!-- sam -->
  <g filter="url(#shadow)">
    <rect x="500" y="166" width="150" height="104" rx="52" fill="#F1EFFF" stroke="#AAA0E5" stroke-width="1.5"/>
  </g>
  <text x="575" y="211" text-anchor="middle" fill="#463E74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">SAM</text>
  <text x="575" y="237" text-anchor="middle" fill="#706895" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5">render mask</text>

  <!-- inspect -->
  <g filter="url(#shadow)">
    <rect x="696" y="128" width="234" height="180" rx="22" fill="#E9F8F3" stroke="#76BCA8" stroke-width="1.5"/>
  </g>
  <rect x="716" y="148" width="46" height="27" rx="13.5" fill="#FFFFFF" fill-opacity="0.78"/>
  <text x="739" y="167" text-anchor="middle" fill="#2B8870" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750">02</text>
  <text x="716" y="208" fill="#174F41" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750">INSPECT</text>
  <text x="716" y="237" fill="#35695C" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Assess mask quality</text>
  <line x1="716" y1="255" x2="910" y2="255" stroke="#C7E6DD"/>
  <text x="716" y="281" fill="#5C7F76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5">accept or request repair</text>

  <!-- final -->
  <g filter="url(#shadow)">
    <rect x="1003" y="94" width="157" height="66" rx="33" fill="#FFFFFF" stroke="#8FC8B8" stroke-width="1.5"/>
  </g>
  <circle cx="1033" cy="127" r="13" fill="#DDF4EC"/>
  <path d="M1027 127l4 4 8-9" fill="none" stroke="#2C8A70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1055" y="132" fill="#234D42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Final mask</text>
  <rect x="944" y="145" width="60" height="24" rx="12" fill="#DDF4EC"/>
  <text x="974" y="162" text-anchor="middle" fill="#28745F" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">READY</text>

  <!-- correct -->
  <g filter="url(#shadow)">
    <rect x="758" y="350" width="264" height="116" rx="22" fill="#FFF3E8" stroke="#E6A974" stroke-width="1.5"/>
  </g>
  <rect x="778" y="370" width="46" height="27" rx="13.5" fill="#FFFFFF" fill-opacity="0.78"/>
  <text x="801" y="389" text-anchor="middle" fill="#B36B30" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750">03</text>
  <text x="842" y="391" fill="#6A4022" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">CORRECT</text>
  <text x="778" y="424" fill="#7A563A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5">EXTRA / MISSING</text>
  <text x="778" y="447" fill="#9A7456" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5">negative / positive point</text>
  <rect x="941" y="319" width="70" height="24" rx="12" fill="#FFE5CF"/>
  <text x="976" y="336" text-anchor="middle" fill="#9B5A28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">REFINE</text>

  <rect x="620" y="428" width="96" height="24" rx="12" fill="#EEF3F6"/>
  <text x="668" y="445" text-anchor="middle" fill="#637E8E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">NEW PROMPT</text>
</svg>
